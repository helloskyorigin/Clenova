name: Android quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify localization resources
        run: python3 tools/check_localization.py
      - name: Install required Android SDK
        shell: bash
        run: |
          # GitHub-hosted Ubuntu already includes Android command-line tools.
          # Avoid setup-android's obsolete "tools" package installation.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:?Android SDK missing}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-37' 'platforms;android-36.1' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK and run tests
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-qa-results
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
