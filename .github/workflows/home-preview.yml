name: Android build and Clean QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: JVM regression tests
        run: |
          javac -d /tmp/clenova-tests app/src/main/java/com/clenova/app/ReviewPlan.java app/src/main/java/com/clenova/app/CleanupPreview.java app/src/main/java/com/clenova/app/StoragePreview.java tests/ReviewPlanTest.java app/src/main/java/com/clenova/app/AppStrings.java tests/AppStringsTest.java app/src/main/java/com/clenova/app/ProtectionPolicy.java tests/ProtectionPolicyTest.java app/src/main/java/com/clenova/app/FolderExclusion.java tests/FolderExclusionTest.java app/src/main/java/com/clenova/app/FaqSearch.java tests/FaqSearchTest.java app/src/main/java/com/clenova/app/FeedbackDraft.java tests/FeedbackDraftTest.java
          java -cp /tmp/clenova-tests com.clenova.app.ReviewPlanTest
          java -cp /tmp/clenova-tests com.clenova.app.AppStringsTest
          java -cp /tmp/clenova-tests com.clenova.app.ProtectionPolicyTest
          java -cp /tmp/clenova-tests com.clenova.app.FolderExclusionTest
          java -cp /tmp/clenova-tests com.clenova.app.FaqSearchTest
          java -cp /tmp/clenova-tests com.clenova.app.FeedbackDraftTest
      - name: Verify clutter rules
        run: |
          javac -d /tmp/clenova-tests app/src/main/java/com/clenova/app/ClutterRules.java tests/ClutterRulesTest.java
          java -cp /tmp/clenova-tests com.clenova.app.ClutterRulesTest
      - name: Verify Agent routing
        run: |
          javac -d /tmp/clenova-tests app/src/main/java/com/clenova/app/AgentActions.java tests/AgentActionsTest.java
          java -cp /tmp/clenova-tests com.clenova.app.AgentActionsTest
      - name: Install required SDK packages
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Clenova-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Android lint
        run: bash ./gradlew :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Home and Clean smoke test and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash scripts/home-smoke.sh && bash scripts/clean-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Emulator-evidence
          path: |
            build/home-evidence/
            build/clean-evidence/
